<!DOCTYPE html>
<html lang="pt" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bingo Maker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar bg-white border-bottom sticky-top">
  <div class="container-fluid gap-2">
    <button class="btn btn-outline-secondary d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#side" aria-label="Menu">
      <i class="bi bi-list"></i>
    </button>
    <span class="navbar-brand mb-0 me-auto fw-bold"><i class="bi bi-grid-3x3-gap-fill text-primary me-2"></i>Bingo Maker</span>
    <i class="bi bi-translate"></i>
    <select id="lang" class="form-select w-auto" aria-label="Language"></select>
  </div>
</nav>

<div class="d-lg-flex">
  <aside id="side" class="offcanvas-lg offcanvas-start bg-white border-end" tabindex="-1" style="--bs-offcanvas-width:300px">
    <div class="offcanvas-header border-bottom">
      <h5 class="offcanvas-title" data-i18n="myBingos"></h5>
      <button class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#side"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column p-3 gap-3" style="min-width:280px;min-height:calc(100vh - 66px)">
      <button class="btn btn-primary" id="btnNew"><i class="bi bi-plus-lg me-1"></i><span data-i18n="new"></span></button>
      <div class="list-group" id="list"></div>
    </div>
  </aside>

  <main class="flex-grow-1 p-3 p-md-4" style="min-width:0">
    <div id="empty" class="text-center text-secondary py-5 d-none">
      <i class="bi bi-grid-3x3 display-1"></i>
      <h2 class="mt-3" data-i18n="empty"></h2>
      <p data-i18n="emptyHint"></p>
      <button class="btn btn-primary btn-lg" id="btnNew2"><i class="bi bi-plus-lg me-1"></i><span data-i18n="new"></span></button>
    </div>

    <div id="editor" class="mx-auto d-none" style="max-width:800px">
      <input id="bName" class="form-control form-control-lg fw-bold mb-2" data-i18n-ph="namePh" maxlength="80">
      <textarea id="bDesc" class="form-control mb-3" rows="2" data-i18n-ph="descPh" maxlength="300"></textarea>
      <div class="d-flex align-items-center gap-2 mb-3">
        <label for="bSize" class="form-label mb-0" data-i18n="size"></label>
        <select id="bSize" class="form-select w-auto"></select>
      </div>

      <div id="grid" class="d-grid border-top border-start border-dark bg-white"></div>

      <div class="d-flex flex-wrap gap-2 mt-3">
        <button class="btn btn-success" id="btnPdf"><i class="bi bi-file-earmark-pdf me-1"></i><span data-i18n="pdf"></span></button>
        <button class="btn btn-success" id="btnImg"><i class="bi bi-image me-1"></i><span data-i18n="img"></span></button>
        <button class="btn btn-outline-danger ms-auto" id="btnDel"><i class="bi bi-trash me-1"></i><span data-i18n="del"></span></button>
      </div>
    </div>
  </main>
</div>

<div class="modal fade" id="modal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <form class="modal-content" id="form">
      <div class="modal-header">
        <h5 class="modal-title" data-i18n="newTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <label class="form-label" for="mName" data-i18n="name"></label>
        <input id="mName" class="form-control mb-3" required maxlength="80" data-i18n-ph="namePh">
        <label class="form-label" for="mDesc" data-i18n="desc"></label>
        <textarea id="mDesc" class="form-control mb-3" rows="2" maxlength="300" data-i18n-ph="descPh"></textarea>
        <label class="form-label" for="mSize" data-i18n="size"></label>
        <select id="mSize" class="form-select"></select>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" data-i18n="cancel"></button>
        <button type="submit" class="btn btn-primary" data-i18n="create"></button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ---------- i18n: para adicionar um idioma, basta incluir um novo objeto aqui ---------- */
const I18N = {
  en: { _name: 'English', myBingos: 'My bingos', new: 'New bingo', newTitle: 'New bingo', name: 'Name', desc: 'Description',
    namePh: 'Bingo name', descPh: 'Description (optional)', size: 'Size', pdf: 'Save as PDF', img: 'Save as image',
    del: 'Delete', delConfirm: 'Delete this bingo?', create: 'Create', cancel: 'Cancel', untitled: 'Untitled',
    empty: 'No bingos yet', emptyHint: 'Create your first bingo and share it with your friends!' },
  es: { _name: 'Español', myBingos: 'Mis bingos', new: 'Nuevo bingo', newTitle: 'Nuevo bingo', name: 'Nombre', desc: 'Descripción',
    namePh: 'Nombre del bingo', descPh: 'Descripción (opcional)', size: 'Tamaño', pdf: 'Guardar en PDF', img: 'Guardar como imagen',
    del: 'Eliminar', delConfirm: '¿Eliminar este bingo?', create: 'Crear', cancel: 'Cancelar', untitled: 'Sin título',
    empty: 'Aún no hay bingos', emptyHint: '¡Crea tu primer bingo y compártelo con tus amigos!' },
  pt: { _name: 'Português', myBingos: 'Meus bingos', new: 'Novo bingo', newTitle: 'Novo bingo', name: 'Nome', desc: 'Descrição',
    namePh: 'Nome do bingo', descPh: 'Descrição (opcional)', size: 'Tamanho', pdf: 'Salvar em PDF', img: 'Salvar como imagem',
    del: 'Excluir', delConfirm: 'Excluir este bingo?', create: 'Criar', cancel: 'Cancelar', untitled: 'Sem título',
    empty: 'Nenhum bingo ainda', emptyHint: 'Crie seu primeiro bingo e mande para os amigos!' }
};

/* ---------- estado e armazenamento ---------- */
const LS = 'bingomaker.v1';
const $ = id => document.getElementById(id);
let S = { bingos: [], cur: null, lang: null };
try { Object.assign(S, JSON.parse(localStorage.getItem(LS))); } catch (e) {}
const SIZES = [3, 4, 5, 6, 7], MAX = Math.max(...SIZES);
S.bingos.forEach(b => { // migra bingos antigos para a grade de apoio fixa
  if (b.cells.length === MAX * MAX) return;
  const c = Array(MAX * MAX).fill('');
  for (let r = 0; r < b.size; r++) for (let k = 0; k < b.size; k++) c[r * MAX + k] = b.cells[r * b.size + k] || '';
  b.cells = c;
});
const save = () => { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} };
const cur = () => S.bingos.find(b => b.id === S.cur);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const t = k => (I18N[S.lang] || I18N.en)[k] ?? I18N.en[k] ?? k;

function applyI18n() {
  document.documentElement.lang = S.lang;
  document.querySelectorAll('[data-i18n]').forEach(e => e.textContent = t(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(e => e.placeholder = t(e.dataset.i18nPh));
  renderList();
}

/* ---------- renderização ---------- */
function renderList() {
  $('list').innerHTML = '';
  S.bingos.forEach(b => {
    const a = document.createElement('button');
    a.className = 'list-group-item list-group-item-action text-truncate' + (b.id === S.cur ? ' active' : '');
    a.innerHTML = '<i class="bi bi-grid-3x3-gap me-2"></i>';
    a.append((b.name || t('untitled')) + ' (' + b.size + '×' + b.size + ')');
    a.onclick = () => { S.cur = b.id; save(); show(); if (innerWidth < 992) bootstrap.Offcanvas.getOrCreateInstance($('side')).hide(); };
    $('list').append(a);
  });
}

function show() {
  const b = cur();
  $('empty').classList.toggle('d-none', !!b);
  $('editor').classList.toggle('d-none', !b);
  renderList();
  if (!b) return;
  $('bName').value = b.name; $('bDesc').value = b.desc; $('bSize').value = b.size;
  renderGrid();
}

function renderGrid() {
  const b = cur(), n = b.size, g = $('grid');
  g.innerHTML = '';
  g.style.gridTemplateColumns = `repeat(${n}, minmax(0, 1fr))`;
  const cellCls = 'border-end border-bottom border-dark d-flex align-items-center justify-content-center text-center p-1';
  if (n === 5) 'BINGO'.split('').forEach(l => {
    const h = document.createElement('div');
    h.className = cellCls + ' fs-2 fw-bold py-2'; h.textContent = l; g.append(h);
  });
  for (let i = 0; i < n * n; i++) {
    const k = Math.floor(i / n) * MAX + (i % n);
    const c = document.createElement('div');
    c.className = cellCls; c.contentEditable = 'true'; c.style.aspectRatio = '1'; c.style.wordBreak = 'break-word';
    c.textContent = b.cells[k] || '';
    c.oninput = () => { b.cells[k] = c.innerText.trim(); save(); };
    c.onpaste = e => { e.preventDefault(); document.execCommand('insertText', false, e.clipboardData.getData('text/plain')); };
    g.append(c);
  }
}

/* ---------- ações ---------- */
$('bName').oninput = e => { cur().name = e.target.value; save(); renderList(); };
$('bDesc').oninput = e => { cur().desc = e.target.value; save(); };
$('bSize').onchange = e => { cur().size = +e.target.value; save(); renderGrid(); renderList(); };
$('btnDel').onclick = () => {
  if (!confirm(t('delConfirm'))) return;
  S.bingos = S.bingos.filter(b => b.id !== S.cur);
  S.cur = S.bingos[0]?.id ?? null; save(); show();
};

const modal = new bootstrap.Modal($('modal'));
const openNew = () => { $('form').reset(); $('mSize').value = 5; modal.show(); };
$('btnNew').onclick = $('btnNew2').onclick = openNew;
$('modal').addEventListener('shown.bs.modal', () => $('mName').focus());
$('form').onsubmit = e => {
  e.preventDefault();
  const n = +$('mSize').value;
  const b = { id: uid(), name: $('mName').value.trim(), desc: $('mDesc').value.trim(), size: n, cells: Array(MAX * MAX).fill('') };
  S.bingos.unshift(b); S.cur = b.id; save(); modal.hide(); show();
  if (innerWidth < 992) bootstrap.Offcanvas.getOrCreateInstance($('side')).hide();
};

/* ---------- exportação (folha A4 = 794×1123 px @96dpi) ---------- */
function buildSheet(b) {
  const n = b.size, P = 40, gw = 794 - 2 * P, cs = gw / n;
  const el = document.createElement('div');
  el.style.cssText = `position:fixed;left:-10000px;top:0;width:794px;height:1123px;padding:${P}px;box-sizing:border-box;background:#fff;color:#000;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;justify-content:center`;
  const h = document.createElement('div');
  h.style.cssText = 'text-align:center;font-size:36px;font-weight:700;margin-bottom:8px;word-break:break-word';
  h.textContent = b.name || t('untitled');
  const d = document.createElement('div');
  d.style.cssText = 'text-align:center;font-size:18px;margin-bottom:20px;white-space:pre-wrap;word-break:break-word';
  d.textContent = b.desc;
  const g = document.createElement('div');
  g.style.cssText = `display:grid;grid-template-columns:repeat(${n},${cs}px);border-top:2px solid #000;border-left:2px solid #000;width:${gw}px;box-sizing:content-box`;
  const cell = (txt, extra) => {
    const c = document.createElement('div');
    c.style.cssText = `border-right:2px solid #000;border-bottom:2px solid #000;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;box-sizing:border-box;padding:6px;word-break:break-word;${extra}`;
    c.textContent = txt; g.append(c);
  };
  if (n === 5) 'BINGO'.split('').forEach(l => cell(l, 'height:80px;font-size:44px;font-weight:700'));
  for (let i = 0; i < n * n; i++) cell(b.cells[Math.floor(i / n) * MAX + (i % n)] || '', `height:${cs}px;font-size:${n <= 5 ? 22 : 16}px`);
  el.append(h, d, g);
  return el;
}

async function exportBingo(kind, btn) {
  const b = cur(); btn.disabled = true;
  const sheet = buildSheet(b); document.body.append(sheet);
  try {
    const canvas = await html2canvas(sheet, { scale: 2, backgroundColor: '#fff' });
    const file = (b.name || 'bingo').replace(/[^\w\-]+/g, '_').slice(0, 40) || 'bingo';
    if (kind === 'img') {
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png'); a.download = file + '.png'; a.click();
    } else {
      const pdf = new jspdf.jsPDF({ unit: 'mm', format: 'a4' });
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, 210, 297);
      pdf.save(file + '.pdf');
    }
  } finally { sheet.remove(); btn.disabled = false; }
}
$('btnPdf').onclick = e => exportBingo('pdf', e.currentTarget);
$('btnImg').onclick = e => exportBingo('img', e.currentTarget);

/* ---------- init ---------- */
$('lang').innerHTML = Object.entries(I18N).map(([k, v]) => `<option value="${k}">${v._name}</option>`).join('');
const sizeOpts = SIZES.map(n => `<option value="${n}">${n}×${n}</option>`).join('');
$('bSize').innerHTML = $('mSize').innerHTML = sizeOpts;
if (!I18N[S.lang]) { const nav = (navigator.language || 'en').slice(0, 2); S.lang = I18N[nav] ? nav : 'en'; }
$('lang').value = S.lang;
$('lang').onchange = e => { S.lang = e.target.value; save(); applyI18n(); };
if (!cur()) S.cur = S.bingos[0]?.id ?? null;
applyI18n(); show();
</script>
</body>
</html>
