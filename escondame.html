<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homoglyphs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4" style="max-width: 900px">

  <header class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
    <div>
      <h1 class="h2 mb-1"><i class="bi bi-fonts me-2"></i><span data-i18n="title"></span></h1>
      <p class="text-body-secondary mb-0" data-i18n="subtitle"></p>
    </div>
    <div class="input-group w-auto">
      <span class="input-group-text"><i class="bi bi-translate"></i></span>
      <select id="lang" class="form-select" aria-label="Language"></select>
    </div>
  </header>

  <section class="mb-4">
    <label for="input" class="form-label fw-semibold" data-i18n="inputLabel"></label>
    <textarea id="input" class="form-control form-control-lg" rows="7" data-i18n-placeholder="inputPlaceholder"></textarea>
  </section>

  <section class="card mb-4">
    <div class="card-body">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h2 class="h5 mb-0"><i class="bi bi-check2-square me-2"></i><span data-i18n="lettersTitle"></span></h2>
        <div class="d-flex flex-wrap gap-2">
          <button type="button" class="btn btn-outline-primary" id="selAll"><i class="bi bi-check-all me-1"></i><span data-i18n="selectAll"></span></button>
          <button type="button" class="btn btn-outline-secondary" id="selNone"><i class="bi bi-x-lg me-1"></i><span data-i18n="selectNone"></span></button>
        </div>
      </div>

      <h3 class="h6 mb-2" data-i18n="uppercase"></h3>
      <div class="row g-2 mb-4" id="upper"></div>

      <h3 class="h6 mb-2" data-i18n="lowercase"></h3>
      <div class="row g-2" id="lower"></div>
    </div>
  </section>

  <section class="mb-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
      <label for="output" class="form-label fw-semibold mb-0" data-i18n="outputLabel"></label>
      <span class="badge text-bg-secondary fs-6"><span data-i18n="replaced"></span>: <span id="count">0</span></span>
    </div>
    <textarea id="output" class="form-control form-control-lg bg-body-tertiary" rows="7" readonly></textarea>
    <button type="button" id="copy" class="btn btn-success btn-lg w-100 mt-3">
      <i class="bi bi-clipboard me-2" id="copyIcon"></i><span id="copyText"></span>
    </button>
  </section>

  <p class="text-body-secondary" data-i18n="note"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  /* ---------- Dark/light automático ---------- */
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const applyTheme = () => document.documentElement.setAttribute('data-bs-theme', mq.matches ? 'dark' : 'light');
  applyTheme(); mq.addEventListener('change', applyTheme);

  /* ---------- Traduções: para adicionar um idioma, copie um bloco e traduza ---------- */
  const translations = {
    pt: {
      name: 'Português',
      title: 'Conversor de homóglifos',
      subtitle: 'Troque letras por caracteres visualmente idênticos para driblar filtros de palavras.',
      inputLabel: 'Seu texto',
      inputPlaceholder: 'Digite ou cole seu texto aqui…',
      lettersTitle: 'Letras que serão trocadas',
      selectAll: 'Marcar todas',
      selectNone: 'Desmarcar todas',
      uppercase: 'Maiúsculas',
      lowercase: 'Minúsculas',
      outputLabel: 'Resultado',
      replaced: 'Letras trocadas',
      copy: 'Copiar resultado',
      copied: 'Copiado!',
      copyError: 'Não foi possível copiar',
      note: 'Dica: desmarque as letras que parecem diferentes na sua fonte e troque apenas as letras das palavras bloqueadas.'
    },
    en: {
      name: 'English',
      title: 'Homoglyph converter',
      subtitle: 'Swap letters for look-alike characters to get past word filters.',
      inputLabel: 'Your text',
      inputPlaceholder: 'Type or paste your text here…',
      lettersTitle: 'Letters to replace',
      selectAll: 'Select all',
      selectNone: 'Select none',
      uppercase: 'Uppercase',
      lowercase: 'Lowercase',
      outputLabel: 'Result',
      replaced: 'Letters replaced',
      copy: 'Copy result',
      copied: 'Copied!',
      copyError: 'Could not copy',
      note: 'Tip: uncheck letters that look different in your font and only replace letters in the blocked words.'
    }
  };

  const homoglyphs = {
    A: ['А'], B: ['В'], C: ['С'], D: ['ԁ'], E: ['Е'], F: ['Ғ'], G: ['Ԍ'], H: ['Н'], I: ['І'],
    J: ['Ј'], K: ['К'], L: ['Ӏ'], M: ['М'], N: ['Ν'], O: ['О'], P: ['Р'], Q: ['Ԛ'], R: ['Я'],
    S: ['Ѕ'], T: ['Т'], U: ['Ц'], V: ['Ѵ'], W: ['Ԝ'], X: ['Х'], Y: ['Υ'], Z: ['Ζ'],
    a: ['а'], b: ['Ь'], c: ['с'], d: ['ԁ'], e: ['е'], f: ['ғ'], g: ['ց'], h: ['һ'], i: ['і'],
    j: ['ј'], k: ['к'], l: ['ӏ'], m: ['м'], n: ['ո'], o: ['о', 'ο'], p: ['р'], q: ['ԛ'], r: ['г'],
    s: ['ѕ'], t: ['т'], u: ['υ'], v: ['ν'], w: ['ԝ'], x: ['х'], y: ['у'], z: ['ᴢ']
  };

  const $ = id => document.getElementById(id);
  const input = $('input'), output = $('output');
  let lang = 'pt';

  /* ---------- i18n ---------- */
  const t = key => translations[lang][key] ?? translations.en[key] ?? key;

  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => el.placeholder = t(el.dataset.i18nPlaceholder));
    $('copyText').textContent = t('copy');
  }

  Object.entries(translations).forEach(([code, tr]) => $('lang').add(new Option(tr.name, code)));
  const browserLang = (navigator.language || 'pt').slice(0, 2);
  lang = translations[browserLang] ? browserLang : 'pt';
  $('lang').value = lang;
  $('lang').addEventListener('change', e => { lang = e.target.value; applyLang(); });

  /* ---------- Checkboxes (btn-check do Bootstrap) ---------- */
  function buildLetters(container, letters) {
    container.innerHTML = [...letters].map(ch => `
      <div class="col-2 col-sm-1">
        <input type="checkbox" class="btn-check letter" id="chk-${ch}" value="${ch}" checked autocomplete="off">
        <label class="btn btn-outline-primary btn-lg w-100 px-0" for="chk-${ch}">${ch}</label>
      </div>`).join('');
  }
  buildLetters($('upper'), 'ABCDEFGHIJKLMNOPQRSTUVWXYZ');
  buildLetters($('lower'), 'abcdefghijklmnopqrstuvwxyz');

  const checks = () => document.querySelectorAll('.letter');
  const setAll = state => { checks().forEach(c => c.checked = state); convert(); };
  $('selAll').addEventListener('click', () => setAll(true));
  $('selNone').addEventListener('click', () => setAll(false));
  document.addEventListener('change', e => { if (e.target.classList.contains('letter')) convert(); });

  /* ---------- Conversão em tempo real ---------- */
  function convert() {
    const selected = new Set([...checks()].filter(c => c.checked).map(c => c.value));
    let count = 0;
    output.value = Array.from(input.value).map(ch => {
      if (selected.has(ch) && homoglyphs[ch]) { count++; return homoglyphs[ch][0]; }
      return ch;
    }).join('');
    $('count').textContent = count;
  }
  input.addEventListener('input', convert);

  /* ---------- Copiar ---------- */
  async function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    output.select(); output.setSelectionRange(0, text.length);
    if (!document.execCommand('copy')) throw new Error('copy failed');
  }

  $('copy').addEventListener('click', async () => {
    const btn = $('copy'), icon = $('copyIcon');
    let ok = true;
    try { await copyText(output.value); } catch { ok = false; }
    $('copyText').textContent = t(ok ? 'copied' : 'copyError');
    icon.className = 'bi me-2 ' + (ok ? 'bi-clipboard-check' : 'bi-exclamation-triangle');
    btn.disabled = true;
    setTimeout(() => {
      $('copyText').textContent = t('copy');
      icon.className = 'bi bi-clipboard me-2';
      btn.disabled = false;
    }, 1800);
  });

  applyLang();
  convert();
</script>
</body>
</html>
