<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Tempo</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        /* Garantindo o tamanho mínimo de fonte exigido */
        html, body {
            font-size: 16px;
            background-color: #f8f9fa;
        }
        
        .card {
            border: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .result-box {
            background-color: #e9ecef;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            height: 100%;
        }

        .result-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #0d6efd;
            display: block;
        }

        .result-label {
            font-size: 1rem;
            color: #6c757d;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card p-4">
                <h2 class="mb-4 text-center"><i class="fa-solid fa-clock-rotate-left text-primary me-2"></i>Calculadora de Intervalo de Tempo</h2>
                
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="dateStart" class="form-label fw-bold">Data e Hora Inicial</label>
                        <input type="datetime-local" class="form-control form-control-lg" id="dateStart" step="1">
                    </div>
                    <div class="col-md-6">
                        <label for="dateEnd" class="form-label fw-bold">Data e Hora Final</label>
                        <input type="datetime-local" class="form-control form-control-lg" id="dateEnd" step="1">
                    </div>
                </div>

                <div class="alert alert-primary text-center mb-4" role="alert">
                    <h4 class="alert-heading mb-0">
                        <i class="fa-regular fa-calendar-days me-2"></i>Total em Dias Corridos: 
                        <span id="totalDays" class="fw-bold">0</span>
                    </h4>
                </div>

                <h5 class="mb-3 border-bottom pb-2">Tempo Decorrido Detalhado</h5>
                <div class="row g-3">
                    <div class="col-4 col-md-2">
                        <div class="result-box">
                            <span class="result-value" id="resYears">0</span>
                            <span class="result-label">Anos</span>
                        </div>
                    </div>
                    <div class="col-4 col-md-2">
                        <div class="result-box">
                            <span class="result-value" id="resMonths">0</span>
                            <span class="result-label">Meses</span>
                        </div>
                    </div>
                    <div class="col-4 col-md-2">
                        <div class="result-box">
                            <span class="result-value" id="resDays">0</span>
                            <span class="result-label">Dias</span>
                        </div>
                    </div>
                    <div class="col-4 col-md-2">
                        <div class="result-box">
                            <span class="result-value" id="resHours">0</span>
                            <span class="result-label">Horas</span>
                        </div>
                    </div>
                    <div class="col-4 col-md-2">
                        <div class="result-box">
                            <span class="result-value" id="resMinutes">0</span>
                            <span class="result-label">Mins</span>
                        </div>
                    </div>
                    <div class="col-4 col-md-2">
                        <div class="result-box">
                            <span class="result-value" id="resSeconds">0</span>
                            <span class="result-label">Segs</span>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<script>
    function calculateTimeDifference() {
        const startVal = document.getElementById('dateStart').value;
        const endVal = document.getElementById('dateEnd').value;

        // Só calcula se ambas as datas estiverem preenchidas
        if (!startVal || !endVal) return;

        let startDate = new Date(startVal);
        let endDate = new Date(endVal);

        // Inverte as datas se a inicial for maior que a final para manter o resultado positivo
        if (startDate > endDate) {
            const temp = startDate;
            startDate = endDate;
            endDate = temp;
        }

        // --- Cálculo de Dias Corridos Totais ---
        const diffMs = endDate.getTime() - startDate.getTime();
        const totalDays = diffMs / (1000 * 60 * 60 * 24);
        
        // Formata para 2 casas decimais caso haja quebra de horas, ou remove decimais se for exato
        document.getElementById('totalDays').innerText = totalDays.toLocaleString('pt-BR', { 
            minimumFractionDigits: 0, 
            maximumFractionDigits: 2 
        });

        // --- Cálculo Detalhado (Anos, Meses, Dias, Horas, Minutos, Segundos) ---
        let years = endDate.getFullYear() - startDate.getFullYear();
        let months = endDate.getMonth() - startDate.getMonth();
        let days = endDate.getDate() - startDate.getDate();
        let hours = endDate.getHours() - startDate.getHours();
        let minutes = endDate.getMinutes() - startDate.getMinutes();
        let seconds = endDate.getSeconds() - startDate.getSeconds();

        // Ajuste retroativo (vai emprestando da unidade maior quando a diferença é negativa)
        if (seconds < 0) {
            seconds += 60;
            minutes--;
        }
        if (minutes < 0) {
            minutes += 60;
            hours--;
        }
        if (hours < 0) {
            hours += 24;
            days--;
        }
        if (days < 0) {
            // Descobre quantos dias tinha o mês anterior para fazer o empréstimo correto
            const prevMonth = new Date(endDate.getFullYear(), endDate.getMonth(), 0);
            days += prevMonth.getDate();
            months--;
        }
        if (months < 0) {
            months += 12;
            years--;
        }

        // Atualizando o DOM
        document.getElementById('resYears').innerText = years;
        document.getElementById('resMonths').innerText = months;
        document.getElementById('resDays').innerText = days;
        document.getElementById('resHours').innerText = hours;
        document.getElementById('resMinutes').innerText = minutes;
        document.getElementById('resSeconds').innerText = seconds;
    }

    // O evento 'input' detecta tanto a digitação manual quanto a seleção no datepicker
    document.getElementById('dateStart').addEventListener('input', calculateTimeDifference);
    document.getElementById('dateEnd').addEventListener('input', calculateTimeDifference);
</script>

</body>
</html>
